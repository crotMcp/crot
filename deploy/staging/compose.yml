name: crot-staging
services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=0700,uid=10001,gid=10001"]
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./config:/config:ro
      - registry:/state
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  registry:
