name: crot-production
services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=0700,uid=10001,gid=10001"]
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./config:/config:ro
      - relay-state:/state
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8443/.crot/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options: { max-size: "10m", max-file: "5" }
volumes:
  relay-state:
