name: crot-production
services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/production/Dockerfile
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,mode=0700,uid=10001,gid=10001"]
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./config:/config:ro
      - relay-state:/state
    healthcheck:
      # Local liveness only. Public certificate and hostname validation belongs to
      # the external SLO probe described in docs/OPERATIONS_RUNBOOK.md.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:https').get({host:'127.0.0.1',port:8443,path:'/.crot/health',rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: local
      options: { max-size: "10m", max-file: "5" }
volumes:
  relay-state:
