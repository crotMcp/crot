name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # CROT Browser Extension sources and tests (against a fake chrome API).
      - run: npm run typecheck:extension
      # Verify the production builds; tests build their own copy of CROT for the stdio and browser end-to-end tests.
      - run: npm run build
      - run: npm run build:extension
      - run: npm test
      - run: npm run test:extension
