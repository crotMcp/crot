name: Lockfile (koffi)

# One-shot: resolve koffi and its platform subpackages into package-lock.json.
# Runs only when the marker file changes; removed after use.
on:
  push:
    branches: [main]
    paths: [".github/lockfile-request"]

permissions:
  contents: write

concurrency: lockfile-koffi

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add koffi 3.3.2 as an optional dependency (lockfile only, no install scripts)
        run: npm install --save-optional --save-exact --package-lock-only --ignore-scripts koffi@3.3.2
      - name: Verify koffi version and integrity
        run: |
          node -e '
            const fs = require("node:fs");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const k = lock.packages["node_modules/koffi"];
            const expected = "sha512-f9Rrcmpy7lQs0ayJfhaxiG5OLp1aZjXKOFLXo7Gax6snJRKmdpYnYEOkpQ7ImCBrbvOdzFT06EP+FaLZv35W7Q==";
            if (!k || k.version !== "3.3.2" || k.integrity !== expected) { console.error("unexpected koffi entry", JSON.stringify(k)); process.exit(1); }
            if ((pkg.optionalDependencies || {}).koffi !== "3.3.2") { console.error("package.json not updated"); process.exit(1); }
            for (const [p, v] of Object.entries(lock.packages)) if (p.includes("koffi")) console.log(p, v.version, v.integrity);
          '
      - name: Commit lockfile to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/lockfile-request
          git add package.json package-lock.json
          git commit -m "deps: add koffi 3.3.2 as an optional dependency (lockfile resolved on CI)"
          git push
